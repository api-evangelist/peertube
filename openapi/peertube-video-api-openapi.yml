  /api/v1/search/videos:
    get:
      tags:
      - Video
      summary: Search videos
      operationId: searchVideos
      parameters:
      - name: search
        in: query
        required: true
        allowEmptyValue: false
        description: 'String to search. If the user can make a remote URI search, and the string is an URI then the PeerTube instance will fetch the remote object and add it to its database. Then, you can use the REST API to fetch the complete video information and interact with it.

          '
        schema:
          type: string
      - $ref: '#/components/parameters/uuids'
      - $ref: '#/components/parameters/searchTarget'
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/count'
      - $ref: '#/components/parameters/skipCount'
      - $ref: '#/components/parameters/videosSort'
      - $ref: '#/components/parameters/nsfw'
      - $ref: '#/components/parameters/nsfwFlagsIncluded'
      - $ref: '#/components/parameters/nsfwFlagsExcluded'
      - $ref: '#/components/parameters/isLive'
      - $ref: '#/components/parameters/includeScheduledLive'
      - $ref: '#/components/parameters/categoryOneOf'
      - $ref: '#/components/parameters/licenceOneOf'
      - $ref: '#/components/parameters/languageOneOf'
      - $ref: '#/components/parameters/tagsOneOf'
      - $ref: '#/components/parameters/tagsAllOf'
      - $ref: '#/components/parameters/isLocal'
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/hasHLSFiles'
      - $ref: '#/components/parameters/hasWebVideoFiles'
      - $ref: '#/components/parameters/host'
      - $ref: '#/components/parameters/autoTagOneOfVideo'
      - $ref: '#/components/parameters/stateOneOfVideo'
      - $ref: '#/components/parameters/privacyOneOf'
      - $ref: '#/components/parameters/excludeAlreadyWatched'
      - name: startDate
        in: query
        description: Get videos that are published after this date
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Get videos that are published before this date
        schema:
          type: string
          format: date-time
      - name: originallyPublishedStartDate
        in: query
        description: Get videos that are originally published after this date
        schema:
          type: string
          format: date-time
      - name: originallyPublishedEndDate
        in: query
        description: Get videos that are originally published before this date
        schema:
          type: string
          format: date-time
      - name: durationMin
        in: query
        description: Get videos that have this minimum duration
        schema:
          type: integer
      - name: durationMax
        in: query
        description: Get videos that have this maximum duration
        schema:
          type: integer
      responses:
